<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- JS가 뜨기 전 빈 화면도 시스템 테마를 따르게 합니다. 실제 테마는 useTheme이 정합니다. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" />

    <!-- Primary Meta Tags -->
    <title>Devgyurak - Software Engineer & Backend Developer</title>
    <meta name="title" content="Devgyurak - Software Engineer & Backend Developer" />
    <meta
      name="description"
      content="성능과 운영 안정성을 함께 고민하는 백엔드 엔지니어입니다. Python, Django, FastAPI, Kotlin, Spring Boot로 서비스를 개발하고 있습니다."
    />
    <link rel="canonical" href="https://devgyurak.com/" />

    <!--
      Open Graph: Facebook, LinkedIn, 카카오톡, Slack, Discord, iMessage 등이 읽습니다.
      크롤러는 상대 경로를 해석하지 못하는 곳이 많으므로 이미지는 절대 URL로 둡니다.
      이미지를 바꿀 때는 파일 이름도 바꿔야 각 서비스의 썸네일 캐시가 갱신됩니다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devgyurak.com/" />
    <meta property="og:title" content="Devgyurak - Software Engineer & Backend Developer" />
    <meta property="og:description" content="성능과 운영 안정성을 함께 고민하는 백엔드 엔지니어입니다. Python, Django, FastAPI, Kotlin, Spring Boot로 서비스를 개발하고 있습니다." />
    <meta property="og:image" content="https://devgyurak.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://devgyurak.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Devgyurak - Software Engineer & Backend Developer Portfolio" />
    <meta property="og:site_name" content="Devgyurak Portfolio" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- X(Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://devgyurak.com/" />
    <meta name="twitter:title" content="Devgyurak - Software Engineer & Backend Developer" />
    <meta name="twitter:description" content="성능과 운영 안정성을 함께 고민하는 백엔드 엔지니어입니다. Python, Django, FastAPI, Kotlin, Spring Boot로 서비스를 개발하고 있습니다." />
    <meta name="twitter:image" content="https://devgyurak.com/og-image.png" />
    <meta name="twitter:image:alt" content="Devgyurak - Software Engineer & Backend Developer Portfolio" />
    <!-- Additional Meta Tags -->
    <meta name="author" content="Devgyurak" />
    <meta name="keywords" content="Devgyurak, 개발자, Software Engineer, Backend Developer, Python, Django, FastAPI, Kotlin, Spring Boot, 포트폴리오" />
    <meta name="robots" content="index, follow" />
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
