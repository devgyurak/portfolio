name: deploy

# main 에 푸시되거나 PR 이 머지되면(머지도 main 푸시 이벤트입니다) 테스트 · 빌드 뒤
# Cloudflare Workers 로 배포합니다. 설정은 저장소 루트의 wrangler.jsonc 입니다.
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
# - CLOUDFLARE_API_TOKEN: "Edit Cloudflare Workers" 템플릿으로 만든 API 토큰
# - CLOUDFLARE_ACCOUNT_ID: 대시보드 Workers & Pages 개요에 보이는 Account ID
#
# devgyurak.com 은 wrangler.jsonc 의 routes 로 배포할 때 Custom Domain 으로 붙습니다.
# Actions 처럼 비대화형으로 돌면 wrangler 가 그 호스트의 충돌하는 DNS 레코드를 확인 없이 덮어씁니다.
# 그래서 첫 배포가 곧 도메인 전환입니다. 토큰에는 devgyurak.com 존의 Workers Routes 편집 권한이 필요합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 먼저 시작한 쪽이 끝난 뒤 다음 배포가 돕니다. 진행 중인 배포를 끊지 않습니다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 테스트 · 빌드 · 배포
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://devgyurak.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        # `npm ci` 는 lockfile 그대로만 설치합니다.
        run: npm ci

      - name: 테스트
        run: npm test -- --watchAll=false

      - name: 빌드
        # Actions 는 CI=true 라서 CRA 가 경고도 실패로 처리합니다. 경고가 있는 빌드는 배포되지 않습니다.
        run: npm run build

      - name: Cloudflare Workers 배포
        # 시크릿을 받는 서드파티 액션이라 태그 대신 커밋 SHA 로 고정합니다.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: deploy
